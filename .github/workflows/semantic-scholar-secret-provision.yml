name: Provision Semantic Scholar Worker Secret (One-shot)

on:
  push:
    branches: [validation/semantic-scholar-api-20261111]
    paths:
      - 'infrastructure/research-validation/provision-cloudflare-secret.mjs'
      - '.github/workflows/semantic-scholar-secret-provision.yml'

permissions:
  contents: read

concurrency:
  group: semantic-scholar-secret-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check syntax
        run: node --check infrastructure/research-validation/provision-cloudflare-secret.mjs
      - name: Transfer existing secret directly to private staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: node infrastructure/research-validation/provision-cloudflare-secret.mjs
