name: AI Repository Review (Manual, Read-only)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Review focus"
        type: choice
        required: true
        default: maintainability
        options:
          - maintainability
          - security-boundaries
          - testing-gaps

permissions:
  contents: read

concurrency:
  group: ai-readonly-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'anthropic/claude-sonnet-4-6' }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check API key is configured
        env:
          CLINE_DEVELOPMENT_KEY: ${{ secrets.CLINE_DEVELOPMENT_KEY }}
        run: |
          if [ -z "$CLINE_DEVELOPMENT_KEY" ]; then
            echo "::error::Configure CLINE_DEVELOPMENT_KEY in repository Actions secrets before running."
            exit 1
          fi
      - name: Produce advisory AI review
        env:
          CLINE_DEVELOPMENT_KEY: ${{ secrets.CLINE_DEVELOPMENT_KEY }}
          REVIEW_FOCUS: ${{ inputs.focus }}
        run: python3 .github/scripts/ai_readonly_review.py
      - name: Upload advisory report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-readonly-review
          path: ai-review-report.md
          retention-days: 7
