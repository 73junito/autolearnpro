name: Foundation and Academic R1 PR checks

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-and-academic:
    name: Foundation / Academic static and unit gates
    # Use supported LTS image for deterministic Playwright apt dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate required foundation structure
        run: npm run validate:foundation
      - name: Run runtime test suite (no skipped live tests counted)
        run: npm run test:runtime
      - name: Build C3 catalog shell (source-only)
        run: npm run build --workspace @autolearnpro/catalog
      - name: Enforce C3 catalog accessibility boundary
        run: node --test tests/c3-catalog-accessibility.test.mjs
      - name: Enforce C3-R39 catalog data contract and integrity
        run: node --test tests/c3-catalog-data-contract.test.mjs
      - name: Verify deterministic C3-R40 sample and provenance
        run: node infrastructure/scripts/c3-build-sample.mjs --check
      - name: Test C3-R40 provenance and tampering controls
        run: node --test tests/c3-catalog-provenance.test.mjs
      - name: Verify C3-R48 deterministic indexed-mesh fixture (no publication)
        run: node infrastructure/scripts/c3-build-complexity-fixture.mjs --check
      - name: Enforce C3-R48 synthetic GLB geometry and viewer admission budgets
        run: node --test tests/c3-synthetic-geometry-budget.test.mjs tests/c3-geometry-viewer-boundary.test.mjs
      - name: Verify C3-R41 Ed25519 synthetic-development approval boundary
        run: node --test tests/c3-catalog-signed-approval.test.mjs
      - name: Build isolated C3-R42 synthetic viewer (not deployable)
        run: npm run build:viewer:dev --workspace @autolearnpro/catalog
      - name: Verify C3-R42 synthetic viewer integrity and local-only boundaries
        run: node --test tests/c3-synthetic-viewer.test.mjs tests/c3-viewer-local-boundary.test.mjs
      - name: Verify C3-R46 viewer fault and disposal contracts
        run: node --test tests/c3-viewer-lifecycle.test.mjs
      - name: Enforce C3-R47 synthetic viewer bundle and asset budgets
        run: node --test tests/c3-viewer-budgets.test.mjs
      - name: Enforce C3-R49 indexed GLB session and parser hardening
        run: node --test tests/c3-indexed-cube-session.test.mjs tests/c3-r49-parser-hardening.test.mjs tests/c3-r49-build-boundary.test.mjs
      - name: Verify C3-R50 deterministic camera controls and limits
        run: node --test tests/c3-r50-camera-controls.test.mjs
      - name: Enforce C3-R53 accessibility evidence manifest and negative test corpus
        run: |
          node infrastructure/scripts/c3-r53-accessibility-evidence.mjs --check
          node --test tests/c3-r53-accessibility-evidence.test.mjs
      - name: Enforce C3-R54 manual evidence protocol (NOT_TESTED, HOLD only)
        run: |
          node infrastructure/scripts/c3-r54-manual-evidence.mjs --check
          node --test tests/c3-r54-manual-evidence.test.mjs
      - name: Enforce C3-R55 evidence file hashes and independent human review (HOLD only)
        run: |
          node infrastructure/scripts/c3-r55-evidence-integrity.mjs --check
          node --test tests/c3-r55-evidence-integrity.test.mjs
      - name: Enforce C3-R56 accessibility governance and evidence custody (HOLD only)
        run: |
          node infrastructure/scripts/c3-r56-governance.mjs --check
          node --test tests/c3-r56-governance.test.mjs
      - name: Enforce C3-R57 isolated Windows NVDA session preflight plan (NOT_STARTED, HOLD only)
        run: |
          node infrastructure/scripts/c3-r57-windows-preflight.mjs --check
          node --test tests/c3-r57-windows-preflight.test.mjs
      - name: Enforce C3-R66 sole-owner internal review boundary (no independent claim; HOLD only)
        run: |
          node infrastructure/scripts/c3-r66-owner-review.mjs --check
          node --test tests/c3-r66-owner-review.test.mjs
      - name: Provision disposable Chromium, Firefox and WebKit for C3-R43
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run C3-R43/R44 browser rendering and pixel-readback acceptance (no deployment)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: _local/r53-standard-playwright.json
        run: npx playwright test --config playwright.c3-r43.config.mjs --reporter=line,json
      - name: Provision disposable Mesa/Xvfb for C3-R45 Firefox Linux diagnosis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri
      - name: Require C3-R45 Firefox WebGL pixels on virtual software display (no deployment)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MOZ_ENABLE_WAYLAND: '0'
          C3_R45_FIREFOX_HEADFUL: '1'
          C3_R45_REQUIRE_FIREFOX_PIXELS: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: _local/r53-strict-firefox-playwright.json
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -eu -c '
            glxinfo -B
            npx playwright test --config playwright.c3-r43.config.mjs --project firefox --grep "actual rendered triangle|indexed cube is opt-in|C3-R50 accessible bounded controls|C3-R51 keyboard semantics|C3-R52 WCAG-oriented axe audit|C3-R72" --reporter=line,json
          '
      - name: Assemble and enforce C3-R53 accessibility evidence (HOLD only)
        run: node infrastructure/scripts/c3-r53-accessibility-evidence.mjs --assemble _local/r53-standard-playwright.json _local/r53-strict-firefox-playwright.json _local/r53-accessibility-evidence.json
      - name: Archive verified C3-R53 evidence (CI-only; no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: c3-r53-a11y-evidence-${{ github.run_id }}
          path: _local/r53-accessibility-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Run academic unit test suite
        run: npm run test:academic
      - name: Check lint
        run: npm run lint:oxc
      - name: Check formatting
        run: npm run fmt:check
      - name: Enforce R8 source-only release HOLD and no deployment permissions
        run: npm run check:r8-release-hold
      - name: Verify R8A GitHub governance observation stays HOLD
        run: npm run check:r8a-governance
      - name: Check proposed R8B branch protection does not imply authority
        run: npm run check:r8b-protection
      - name: Preserve R8C activation blocker and reviewer preflight
        run: npm run check:r8c-preflight
      - name: Validate R8D solo-maintainer governance proposal stays unapplied
        run: npm run check:r8d-solo
      - name: Verify R8E source-only activation readiness snapshot
        run: npm run check:r8e-readiness
      - name: Verify migration manifest and R1 filename
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -name '*.sql' -type f | sort)
          if [[ ${#migrations[@]} -ne 27 ]]; then
            echo "::error::Expected 27 migration SQL files, found ${#migrations[@]}"
            exit 1
          fi
          test "${migrations[20]}" = "supabase/migrations/20261107000000_executor_private_actor_policy_r2.sql"
          test "${migrations[21]}" = "supabase/migrations/20261108000000_approval_restricted_executor.sql"
          test "${migrations[22]}" = "supabase/migrations/20261114202924_worker_restricted_login_roles_passwordless.sql"
          test "${migrations[23]}" = "supabase/migrations/20261119011728_approval_actor_attestation_boundary.sql"
          test "${migrations[24]}" = "supabase/migrations/20261119024102_approval_active_session_broker.sql"
          test "${migrations[25]}" = "supabase/migrations/20261119030236_approval_atomic_session_lock.sql"
          test "${migrations[26]}" = "supabase/migrations/20261119032011_approval_key_lifecycle.sql"
          sha256sum "supabase/migrations/20261107000000_executor_private_actor_policy_r2.sql"
          sha256sum "supabase/migrations/20261114202924_worker_restricted_login_roles_passwordless.sql" | grep -q "^7b74ddab411d93d83b5d48a1d23e2dab82c3b25e25dcedd4c3bb528ef919b0f1 "
          echo "27 ordered migrations verified."
  r7-workerd-runtime:
    name: R7 Cloudflare workerd local runtime (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real workerd isolation and fail-closed tests
        run: node --test tests/d02e-r7-workerd-runtime.test.mjs

  r1-live-database:
    name: R1 restricted executor (disposable database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start a fresh local database with all migrations
        run: supabase start --exclude studio,logflare,vector,imgproxy,edge-runtime,realtime,storage-api,supavisor,mailpit,postgres-meta
      - name: Enforce restricted-login R1 live suite (3 required)
        env:
          ALP_R1_CI_PROJECT_ID: autolearnpro-foundation6
          ALP_R1_CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55132/postgres
        run: node infrastructure/scripts/run-r1-ci-live.mjs
      - name: Stop and discard disposable local database
        if: always()
        run: supabase stop --no-backup || true
