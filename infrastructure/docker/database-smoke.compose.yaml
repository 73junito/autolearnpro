name: autolearnpro-db-smoke
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: alp_smoke
      POSTGRES_DB: alp_smoke
      POSTGRES_PASSWORD: ${ALP_FOUNDATION_DB_PASSWORD:?Set a disposable test-only password}
    tmpfs:
      - /var/lib/postgresql/data:rw,size=128m,mode=0700
      - /tmp:rw,size=32m
      - /run/postgresql:rw,size=8m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alp_smoke -d alp_smoke"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - isolated
networks:
  isolated:
    internal: true
