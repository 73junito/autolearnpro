name: autolearnpro-foundation
services:
  healthcheck:
    image: busybox:1.37.0
    command: ["sh", "-c", "echo foundation-ready; sleep 3600"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "sh", "-c", "test -x /bin/sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - foundation
networks:
  foundation:
    internal: true
